name: Autodiagnóstico OSC — Disparo Piloto (SIM/NÃO)

on:
  schedule:
    # Piloto Amazonas (45 OSCs divididas em 2 dias: Ter 24/11 = 23 OSCs, Qua 25/11 = 22 OSCs)
    # 4 ondas espaçadas por dia em horário comercial BRT (09:10, 11:10, 13:40, 16:10 BRT = 08:10–15:10 Manaus)
    # Até 6 mensagens por onda + limite diário MAX_DAILY=23 (para automaticamente após 25/11)
    - cron: '10 12 24,25 11 *'
    - cron: '10 14 24,25 11 *'
    - cron: '40 16 24,25 11 *'
    - cron: '10 19 24,25 11 *'
  workflow_dispatch:
    inputs:
      max_messages:
        description: 'Quantidade máxima de OSCs nesta onda (padrão: 6 por onda)'
        required: false
        default: '6'
        type: string
      max_daily:
        description: 'Limite máximo de envios no dia BRT (padrão: 23)'
        required: false
        default: '23'
        type: string
      target_lote:
        description: 'Filtrar lote específico (1, 2 ou vazio para próximos pendentes)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Modo simulação (não envia mensagens reais)?'
        required: false
        default: false
        type: boolean
      force_outside_hours:
        description: 'Forçar fora do horário comercial (Seg–Sex 09:00–17:30 BRT)?'
        required: false
        default: false
        type: boolean

concurrency:
  group: diagnostico-pilot-dispatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Diagnostico Pilot Wave
        env:
          MAX_MESSAGES: ${{ inputs.max_messages || '6' }}
          MAX_DAILY: ${{ inputs.max_daily || '23' }}
          TARGET_LOTE: ${{ inputs.target_lote || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_SEND: ${{ inputs.force_outside_hours || 'false' }}
        run: npx tsx scripts/diagnostico-pilot-dispatcher.ts

      - name: Commit Diagnostico Sent Log
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/diagnostico_sent_log.json
          if git diff --staged --quiet; then
            echo "No diagnostico sent log changes to commit"
          else
            git commit -m "chore(diagnostico): update pilot sent log [skip ci]"
            git pull --rebase origin main
            git push
          fi
