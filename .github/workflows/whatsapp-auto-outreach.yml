name: Cloud WhatsApp Auto-Dispatcher (24/7)

on:
  schedule:
    # Runs automatically in Brasília business hours even when user's PC is OFF:
    # 09:15 BRT (12:15 UTC) and 14:00 BRT (17:00 UTC), Monday to Friday
    - cron: '15 12 * * 1-5'
    - cron: '0 17 * * 1-5'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force send even outside business hours (09:00-17:30 BRT)'
        required: false
        default: 'false'
        type: string

jobs:
  dispatch-whatsapp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Cloud WhatsApp Dispatcher
        env:
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
        run: npx tsx scripts/whatsapp-cloud-dispatcher.ts

      - name: Commit Outreach Log
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/whatsapp_outreach_log.json
          if git diff --staged --quiet; then
            echo "No outreach log changes to commit"
          else
            git commit -m "chore: update cloud whatsapp outreach log [skip ci]"
            git pull --rebase origin main
            git push
          fi
