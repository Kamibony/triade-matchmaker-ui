name: Autodiagnóstico OSC — Lembrete Gratuito (Janela 24h)

on:
  # Execução única agendada para Sábado, 28/11 às 09:30 BRT (12:30 UTC)
  schedule:
    - cron: '30 12 28 11 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo simulação (não envia mensagens reais)?'
        required: false
        default: false
        type: boolean
      min_hours_since_sim:
        description: 'Mínimo de horas desde o clique em Sim (padrão: 2)'
        required: false
        default: '2'
        type: string

concurrency:
  group: diagnostico-24h-followup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-24h-followup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 24h Free-Window Follow-Up
        env:
          GCP_DRIVE_CREDENTIALS: ${{ secrets.GCP_DRIVE_CREDENTIALS }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MIN_HOURS_SINCE_SIM: ${{ inputs.min_hours_since_sim || '2' }}
          MAX_HOURS_SINCE_INBOUND: '23'
        run: npx tsx scripts/diagnostico-24h-followup.ts

      - name: Commit Follow-Up Log
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/diagnostico_followup_log.json
          if git diff --staged --quiet; then
            echo "No follow-up log changes to commit"
          else
            git commit -m "chore(diagnostico): update 24h follow-up log [skip ci]"
            git pull --rebase origin main
            git push
          fi
