name: Outbound Matchmaking Leads Generator

on:
  schedule:
    # Runs at 03:00 UTC (1 hour after Data Ingestion Pipeline at 02:00 UTC to avoid race conditions)
    - cron: '0 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/outbound-match.ts'
  workflow_dispatch:
    inputs:
      max_editais:
        description: 'Max editais to process in this run'
        required: false
        default: '16'
        type: string
      max_per_edital:
        description: 'Max candidate OSCs per edital'
        required: false
        default: '10'
        type: string

concurrency:
  group: outbound-leads-generator
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Matchmaking Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_EDITAIS_PER_RUN: ${{ inputs.max_editais || '8' }}
          MAX_CANDIDATES_PER_EDITAL: ${{ inputs.max_per_edital || '6' }}
        run: npx tsx scripts/outbound-match.ts

      - name: Commit Updated Leads and Cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/cnpj_cache.json src/data/daily_outbound_leads.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily outbound leads and cnpj cache [skip ci]"
            git pull --rebase origin main
            git push
          fi
