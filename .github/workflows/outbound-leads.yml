name: Outbound Matchmaking Leads Generator

on:
  schedule:
    # Runs at 03:00 UTC (1 hour after Data Ingestion Pipeline at 02:00 UTC to avoid race conditions)
    - cron: '0 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/outbound-match.ts'
  workflow_dispatch:
    inputs:
      target_edital_id:
        description: 'Sniper Mode: ID do Edital no Prosas (deixe vazio para modo automático)'
        required: false
        default: ''
        type: string
      target_pdf_url:
        description: 'Sniper Mode: Link de PDF externo (se não estiver no Prosas)'
        required: false
        default: ''
        type: string
      max_editais:
        description: 'Max editais to process (ignorado no Sniper Mode)'
        required: false
        default: '16'
        type: string
      max_per_edital:
        description: 'Max OSCs por edital (vazio = 80 no Sniper Mode, 10 no normal)'
        required: false
        default: ''
        type: string
      replace_unsent:
        description: 'Limpar leads não enviados anteriores? (true/false, vazio=auto)'
        required: false
        default: ''
        type: string

concurrency:
  group: outbound-leads-generator
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Matchmaking Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TARGET_EDITAL_ID: ${{ inputs.target_edital_id }}
          TARGET_PDF_URL: ${{ inputs.target_pdf_url }}
          MAX_EDITAIS_PER_RUN: ${{ inputs.max_editais || '8' }}
          MAX_CANDIDATES_PER_EDITAL: ${{ inputs.max_per_edital }}
          REPLACE_UNSENT_LEADS: ${{ inputs.replace_unsent }}
        run: npx tsx scripts/outbound-match.ts

      - name: Commit Updated Leads and Cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/cnpj_cache.json src/data/daily_outbound_leads.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily outbound leads and cnpj cache [skip ci]"
            git pull --rebase -X theirs origin main
            git push
          fi
