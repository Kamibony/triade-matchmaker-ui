name: Data Ingestion Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/data-pipeline.yml'
  workflow_dispatch:
    inputs:
      max_scrape:
        description: 'Max items to deep scrape'
        required: false
        default: '25'
        type: string
      max_extract:
        description: 'Max items to extract via Gemini'
        required: false
        default: '25'
        type: string
      force_rescrape:
        description: 'Force rescraping of all items'
        required: false
        default: false
        type: boolean

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        env:
          PROSAS_USERNAME: ${{ secrets.PROSAS_USERNAME }}
          PROSAS_PASSWORD: ${{ secrets.PROSAS_PASSWORD }}
          MAX_DEEP_SCRAPE: ${{ github.event.inputs.max_scrape || '25' }}
          FORCE_RESCRAPE: ${{ github.event.inputs.force_rescrape || 'false' }}
        run: npm run scrape-prosas

      - name: Run Extractor Immediately After
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_DRIVE_CREDENTIALS: ${{ secrets.GCP_DRIVE_CREDENTIALS }}
          MAX_EXTRACT: ${{ github.event.inputs.max_extract || '25' }}
        run: npm run extract-metadata

      - name: Safe Git Commit & Push (Editais & Archive)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/editais_prosas.json src/data/editais_historico.json 2>/dev/null || git add src/data/editais_prosas.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update editais_prosas.json & archive expired to editais_historico.json"
            git pull --rebase origin main
            git push
          fi

      - name: Run Outbound Matchmaking Leads Generator Immediately After
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/outbound-match.ts

      - name: Safe Git Commit & Push (Outbound Leads & Cache)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/cnpj_cache.json src/data/daily_outbound_leads.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update daily outbound leads and cnpj cache"
            git pull --rebase origin main
            git push
          fi
